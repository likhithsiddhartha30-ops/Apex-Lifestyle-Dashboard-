<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="images/logo.ico">
<title>ApexLifestyle — Form Correction Videos</title>
<link rel="stylesheet" href="css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.cat-tab{padding:7px 18px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;text-transform:capitalize;letter-spacing:.3px}
.cat-tab:hover{border-color:var(--accent);color:var(--accent)}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:var(--gap)}
.video-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .15s}
.video-card:hover{border-color:var(--border2)}
.video-thumb{position:relative;aspect-ratio:16/9;background:#111;cursor:pointer;overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s}
.video-thumb:hover img{opacity:.8}
.play-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:rgba(0,0,0,.65);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.play-ring .icon{width:18px;height:18px;stroke:#fff;fill:#fff}
.video-thumb iframe{width:100%;height:100%;border:none;position:absolute;inset:0}
.video-info{padding:14px}
.video-title{font-size:13px;font-weight:700;color:var(--t1);line-height:1.4;margin-bottom:5px}
.video-desc{font-size:11px;color:var(--t2);line-height:1.5;margin-bottom:10px}
.video-footer{display:flex;align-items:center}
.cat-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--accent-dim);color:var(--accent);text-transform:capitalize;letter-spacing:.4px}
.empty-state{text-align:center;padding:60px 20px;color:var(--t2);font-size:13px;grid-column:1/-1}
.empty-icon{margin:0 auto 14px;width:40px;height:40px;color:var(--t3);display:flex;align-items:center;justify-content:center}
.empty-icon .icon{width:40px;height:40px;stroke:currentColor;fill:none}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand"><img class="sb-brand-img" src="images/logo.png" alt="ApexLifestyle"></div>
  <div class="sb-user">
    <div class="sb-uname" id="sb-admin-name">—</div>
    <div class="sb-umode" id="sb-admin-role">Client</div>
    <div class="sb-client-label">Viewing Client</div>
    <select id="client-select" class="client-select">
      <option value="">Select client…</option>
    </select>
  </div>
  <nav class="sb-nav">
    <a class="nav-item" href="index.html"      data-page="index.html"><span class="nav-icon">⊞</span>Dashboard</a>
    <a class="nav-item" href="training.html"   data-page="training.html"><span class="nav-icon">⚡</span>Training</a>
    <a class="nav-item" href="nutrition.html"  data-page="nutrition.html"><span class="nav-icon">🍽</span>Nutrition</a>
    <a class="nav-item" href="biometrics.html" data-page="biometrics.html"><span class="nav-icon">📈</span>Biometrics</a>
    <a class="nav-item" href="community.html"  data-page="community.html"><span class="nav-icon">👥</span>Community</a>
  </nav>
  <div class="sb-bottom">
    <div class="sb-links">
      <a class="sb-link" href="#">⓪ Support</a>
      <a class="sb-link" href="#" onclick="signOut();return false;">⏻ Logout</a>
    </div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <img class="topbar-logo" src="images/logo.png" alt="ApexLifestyle">
    <div class="search">
      <span class="search-icon"></span>
      <input type="text" placeholder="Search members...">
    </div>
    <div class="tb-right">
      <div class="icon-btn"><span class="notif-dot"></span></div>
      <div class="icon-btn"></div>
      <div class="avatar"></div>
    </div>
  </header>

  <div class="page-content">
    <div class="pg-eyebrow">Library</div>
    <div class="pg-title" style="margin-bottom:20px">Form Correction Videos</div>

    <div class="cat-tabs" id="cat-tabs">
      <button class="cat-tab active" data-cat="">All</button>
      <button class="cat-tab" data-cat="chest">Chest</button>
      <button class="cat-tab" data-cat="legs">Legs</button>
      <button class="cat-tab" data-cat="back">Back</button>
      <button class="cat-tab" data-cat="shoulders">Shoulders</button>
      <button class="cat-tab" data-cat="arms">Arms</button>
      <button class="cat-tab" data-cat="core">Core</button>
      <button class="cat-tab" data-cat="stretching">Stretching</button>
    </div>

    <div class="video-grid" id="video-grid">
      <div style="color:var(--t2);font-size:13px;padding:8px">Loading…</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js?v=2"></script>
<script src="js/main.js"></script>
<script>
(window._apexPageInit = async () => {
  const session = await requireAuth();
  if (!session) return;
  await initSidebar();

  const esc = t => (t || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let activeCategory = '';
  let allVideos = [];

  document.getElementById('cat-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.cat-tab');
    if (!tab) return;
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCategory = tab.dataset.cat;
    renderGrid();
  });

  function getYouTubeId(url) {
    const m = (url || '').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function renderGrid() {
    const grid = document.getElementById('video-grid');
    const list = activeCategory ? allVideos.filter(v => v.category === activeCategory) : allVideos;
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state">
        <div class="empty-icon"><span data-icon="play"></span></div>
        <div style="font-weight:700;font-size:14px;color:var(--t1);margin-bottom:6px">No videos here yet</div>
        <div>Videos will appear here once your coach adds them.</div>
      </div>`;
      renderIcons(grid);
      return;
    }
    grid.innerHTML = list.map(v => {
      const ytId = getYouTubeId(v.url);
      const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '';
      return `
        <div class="video-card" data-id="${esc(String(v.id))}">
          ${ytId ? `
          <div class="video-thumb" data-ytid="${esc(ytId)}">
            <img src="${esc(thumb)}" alt="${esc(v.title)}" loading="lazy">
            <div class="play-ring"><span data-icon="play"></span></div>
          </div>` : v.url ? `
          <div class="video-thumb" data-url="${esc(v.url)}">
            <video src="${esc(v.url)}" preload="metadata" muted playsinline style="width:100%;height:100%;object-fit:cover;display:block"></video>
            <div class="play-ring"><span data-icon="play"></span></div>
          </div>` : ''}
          <div class="video-info">
            <div class="video-title">${esc(v.title)}</div>
            ${v.description ? `<div class="video-desc">${esc(v.description)}</div>` : ''}
            <div class="video-footer">
              <span class="cat-badge">${esc(v.category)}</span>
            </div>
          </div>
        </div>`;
    }).join('');
    renderIcons(grid);

    grid.querySelectorAll('.video-thumb').forEach(thumb => {
      thumb.addEventListener('click', () => {
        const ytId = thumb.dataset.ytid;
        if (ytId) {
          thumb.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        } else {
          const vid = thumb.querySelector('video');
          if (vid) { thumb.querySelector('.play-ring')?.remove(); vid.setAttribute('controls', ''); vid.play().catch(() => {}); }
        }
      });
    });
  }

  async function loadVideos() {
    const grid = document.getElementById('video-grid');
    grid.innerHTML = '<div style="color:var(--t2);font-size:13px;padding:8px">Loading…</div>';
    try {
      allVideos = await loadFormVideos();
      renderGrid();
    } catch (_) {
      grid.innerHTML = '<div style="color:var(--t2);font-size:13px;padding:8px">Could not load videos.</div>';
    }
  }

  await loadVideos();
})();
</script>
</body>
</html>
