<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexLifestyle — Inbox</title>
<link rel="stylesheet" href="css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand"><img class="sb-brand-img" src="images/logo.png" alt="ApexLifestyle"></div>
  <div class="sb-user">
    <div class="sb-uname" id="sb-admin-name">—</div>
    <div class="sb-umode" id="sb-admin-role">Client</div>
    <div class="sb-client-label">Viewing Client</div>
    <select id="client-select" class="client-select">
      <option value="">Select client…</option>
    </select>
  </div>
  <nav class="sb-nav"></nav>
  <div class="sb-bottom">
    <div class="sb-links">
      <a class="sb-link" href="#">⓪ Support</a>
      <a class="sb-link" href="#" onclick="signOut();return false;">⏻ Logout</a>
    </div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <img class="topbar-logo" src="images/logo.png" alt="ApexLifestyle">
    <div class="search">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search members…">
    </div>
    <div class="tb-right">
      <div class="icon-btn">🔔<span class="notif-dot"></span></div>
      <div class="icon-btn">⚙</div>
      <div class="avatar">🧑</div>
    </div>
  </header>

  <div class="page-content">
    <div class="pg-eyebrow">Messages</div>
    <div class="pg-title">Inbox</div>
    <div class="pg-sub" id="inbox-sub">Your conversations</div>

    <div class="card" style="max-width:680px;margin-top:var(--gap)">
      <input id="conv-search" class="form-input" type="text" placeholder="Search conversations…"
        style="width:100%;margin-bottom:12px;padding:8px 12px;font-size:13px">
      <div id="conv-list">
        <div style="padding:24px;text-align:center;color:var(--t2);font-size:13px">Loading conversations…</div>
      </div>
    </div>
  </div>
</main>

<!-- DM drawer -->
<div class="dm-overlay" id="dm-overlay"></div>
<aside class="dm-drawer" id="dm-drawer">
  <div class="dm-head">
    <div class="member-av" id="dm-av">–</div>
    <div style="flex:1;min-width:0">
      <div id="dm-name" style="font-weight:800;font-size:14px">—</div>
      <div id="dm-role" style="font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px">—</div>
    </div>
    <button class="form-close" id="dm-close">✕</button>
  </div>
  <div class="dm-msgs" id="dm-msgs"></div>
  <div class="dm-input-row">
    <input id="dm-input" class="form-input" type="text" placeholder="Type a message…"
      style="flex:1;padding:9px 12px;font-size:13px" autocomplete="off">
    <button id="dm-send" class="btn-accent" style="padding:9px 16px">Send</button>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js?v=2"></script>
<script src="js/main.js"></script>
<script>
(window._apexPageInit = async () => {
  const session = await requireAuth();
  if (!session) return;
  await initSidebar();

  const esc = t => (t || '').replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
  const timeAgo = (ts) => {
    const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
    if (s < 60)    return 'just now';
    if (s < 3600)  return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  };
  const initials = n => (n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

  let meEmail = '';
  try {
    const { data: { user } } = await db.auth.getUser();
    meEmail = (user && user.email) || '';
  } catch (_) {}

  const convList  = document.getElementById('conv-list');
  const convSearch = document.getElementById('conv-search');
  const inboxSub  = document.getElementById('inbox-sub');

  // ── Load conversations + directory in parallel ──
  const [convs, dir] = await Promise.all([
    loadConversations(meEmail),
    loadDirectory(),
  ]);

  const dirMap  = new Map(dir.map(u => [u.email.toLowerCase(), u]));
  const avatarMap = new Map(dir.filter(u => u.avatar_url).map(u => [u.email.toLowerCase(), u.avatar_url]));

  if (inboxSub) inboxSub.textContent = convs.length
    ? `${convs.length} conversation${convs.length !== 1 ? 's' : ''}`
    : 'No messages yet';

  function renderConvList(filter) {
    const filtered = filter
      ? convs.filter(({ otherEmail }) => {
          const u = dirMap.get(otherEmail) || {};
          return (u.name || otherEmail).toLowerCase().includes(filter);
        })
      : convs;

    if (!filtered.length) {
      convList.innerHTML = `<div style="padding:24px;text-align:center;color:var(--t2);font-size:13px">${
        filter ? 'No conversations match your search.' : 'No messages yet — start a conversation from the Community page.'
      }</div>`;
      return;
    }

    convList.innerHTML = filtered.map(({ otherEmail, lastMsg }) => {
      const u = dirMap.get(otherEmail) || {};
      const name = u.name || otherEmail.split('@')[0];
      const role = u.role || '';
      const avUrl = avatarMap.get(otherEmail);
      const avHtml = avUrl
        ? `<div class="member-av" style="padding:0;overflow:hidden"><img src="${avUrl}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block"></div>`
        : `<div class="member-av">${initials(name)}</div>`;
      const preview = (lastMsg.body || '').slice(0, 60) + (lastMsg.body && lastMsg.body.length > 60 ? '…' : '');
      const mine = (lastMsg.sender_email || '').toLowerCase() === meEmail.toLowerCase();
      return `
        <div class="conv-row" data-email="${esc(otherEmail)}" data-name="${esc(name)}" data-role="${esc(role)}">
          ${avHtml}
          <div class="conv-info">
            <div class="conv-name">${esc(name)}</div>
            <div class="conv-preview">${mine ? 'You: ' : ''}${esc(preview) || '<span style="color:var(--t3)">No messages yet</span>'}</div>
          </div>
          <div class="conv-meta">
            <div class="conv-time">${timeAgo(lastMsg.created_at)}</div>
          </div>
        </div>`;
    }).join('');

    convList.querySelectorAll('.conv-row').forEach(row => {
      row.addEventListener('click', () => {
        openDM(row.dataset.email, row.dataset.name, row.dataset.role);
      });
    });
  }

  renderConvList('');

  if (convSearch) {
    convSearch.addEventListener('input', () => {
      renderConvList(convSearch.value.trim().toLowerCase());
    });
  }

  // ── DM drawer ──
  let _dmOther = null, _dmPoll = null;
  const dmOverlay = document.getElementById('dm-overlay');
  const dmDrawer  = document.getElementById('dm-drawer');
  const dmMsgs    = document.getElementById('dm-msgs');
  const dmInput   = document.getElementById('dm-input');

  async function renderConversation(scroll) {
    if (!_dmOther) return;
    const msgs = await loadConversation(meEmail, _dmOther);
    dmMsgs.innerHTML = msgs.length ? msgs.map(m => {
      const mine = (m.sender_email || '').toLowerCase() === meEmail.toLowerCase();
      const t = new Date(m.created_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      return `<div class="dm-bubble ${mine ? 'me' : 'them'}">${esc(m.body)}<span class="dm-time">${t}</span></div>`;
    }).join('') : '<div style="color:var(--t2);font-size:12px;text-align:center;margin:auto">No messages yet — say hi 👋</div>';
    if (scroll) dmMsgs.scrollTop = dmMsgs.scrollHeight;
  }

  function openDM(email, name, role) {
    _dmOther = email;
    const dmAvEl = document.getElementById('dm-av');
    const avUrl  = email && avatarMap.get(email.toLowerCase());
    if (avUrl) { dmAvEl.innerHTML = `<img src="${avUrl}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">`; }
    else { dmAvEl.textContent = initials(name); }
    document.getElementById('dm-name').textContent = name;
    document.getElementById('dm-role').textContent = role;
    dmOverlay.classList.add('open');
    dmDrawer.classList.add('open');
    renderConversation(true);
    clearInterval(_dmPoll);
    _dmPoll = setInterval(() => renderConversation(false), 3000);
    dmInput.focus();
  }
  function closeDM() {
    dmOverlay.classList.remove('open');
    dmDrawer.classList.remove('open');
    clearInterval(_dmPoll); _dmPoll = null; _dmOther = null;
  }

  document.getElementById('dm-close').addEventListener('click', closeDM);
  dmOverlay.addEventListener('click', closeDM);

  async function doSend() {
    const body = dmInput.value.trim();
    if (!body || !_dmOther) return;
    dmInput.value = '';
    try {
      await sendMessage(meEmail, _dmOther, body);
      await renderConversation(true);
      // refresh conv list in background
      const newConvs = await loadConversations(meEmail);
      newConvs.forEach(c => {
        const idx = convs.findIndex(x => x.otherEmail === c.otherEmail);
        if (idx >= 0) convs[idx] = c; else convs.unshift(c);
      });
      renderConvList(convSearch ? convSearch.value.trim().toLowerCase() : '');
    } catch (_) {
      dmInput.value = body;
      if (window.toast) window.toast('Could not send', 'error');
    }
  }
  document.getElementById('dm-send').addEventListener('click', doSend);
  dmInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSend(); } });

  window._apexOpenDM = openDM;

  // Auto-open DM if arrived via ?dm=email
  try {
    const params = new URLSearchParams(location.search);
    const dmEmail = params.get('dm');
    if (dmEmail) openDM(dmEmail, params.get('name') || dmEmail.split('@')[0], params.get('role') || '');
  } catch (_) {}
})();
</script>
</body>
</html>
