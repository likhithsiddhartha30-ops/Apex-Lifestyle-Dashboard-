<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexLifestyle — Sign In</title>
<link rel="stylesheet" href="css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="login-body">

<!-- Animated background -->
<div class="login-bg">
  <div class="login-blob login-blob-1"></div>
  <div class="login-blob login-blob-2"></div>
  <div class="login-blob login-blob-3"></div>
</div>

<div class="login-wrap">
  <div class="login-card">

    <!-- Brand -->
    <div class="login-brand-area">
      <img src="images/logo.png" alt="ApexLifestyle" class="login-logo">
    </div>

    <div class="login-divider"></div>
    <p class="login-tagline">Sign in to your coaching portal</p>

    <form id="login-form" class="login-form">
      <div class="login-field">
        <label class="login-label">Email</label>
        <div class="login-input-wrap">
          <svg class="login-input-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2.5" y="5" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2.5 7.5L10 12L17.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input class="login-input" type="email" name="email" placeholder="you@example.com" required autofocus>
        </div>
      </div>
      <div class="login-field" id="pass-field">
        <label class="login-label">Password</label>
        <div class="login-input-wrap">
          <svg class="login-input-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="9" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 9V7C7 5.34 8.34 4 10 4C11.66 4 13 5.34 13 7V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input class="login-input" type="password" name="password" placeholder="••••••••" required>
          <button type="button" class="login-eye" id="toggle-pass" aria-label="Show/hide password">
            <svg id="eye-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="10" cy="10" rx="8" ry="5" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="login-err" class="login-err"></div>
      <button id="login-btn" class="btn-accent login-btn" type="submit">
        <span class="login-btn-text">Sign In</span>
        <svg class="login-btn-arrow" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <p class="login-footer">ApexLifestyle &middot; Coach &amp; Client Portal</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js?v=2"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  async function gotoPortal(email) {
    const role = await getUserPortal(email);
    window.location.href = APEX_PORTAL[role].home;
  }

  const { data: { session } } = await db.auth.getSession();
  if (session && session.user) { await gotoPortal(session.user.email); return; }

  const form    = document.getElementById('login-form');
  const errEl   = document.getElementById('login-err');
  const btn     = document.getElementById('login-btn');
  const btnText = btn.querySelector('.login-btn-text');

  // Password show/hide toggle
  const toggleBtn = document.getElementById('toggle-pass');
  const passInput = form.password;
  const eyeIcon   = document.getElementById('eye-icon');
  const EYE_OPEN  = `<ellipse cx="10" cy="10" rx="8" ry="5" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>`;
  const EYE_SHUT  = `<path d="M3 3L17 17M8.3 8.4C8.11 8.76 8 9.17 8 9.6 8 11.03 9.08 12.2 10.5 12.2c.43 0 .84-.11 1.2-.3M5.5 5.6C4 6.7 2.7 8.3 1.5 10c1.3 1.5 4.5 6 9 6 1.5 0 2.8-.5 4-1.2M14 14c.8-.7 1.5-1.5 2-2.2.5-.7.8-1.3 1-1.8-1.3-1.5-4.5-6-9-6-.9 0-1.8.2-2.6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`;
  toggleBtn.addEventListener('click', () => {
    const showing = passInput.type === 'text';
    passInput.type    = showing ? 'password' : 'text';
    eyeIcon.innerHTML = showing ? EYE_OPEN : EYE_SHUT;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled      = true;
    errEl.textContent = '';
    btnText.textContent = 'Signing in…';

    const email    = form.email.value.trim();
    const password = form.password.value;

    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent   = error.message;
      btn.disabled        = false;
      btnText.textContent = 'Sign In';
    } else {
      await gotoPortal(email);
    }
  });
});
</script>
</body>
</html>
